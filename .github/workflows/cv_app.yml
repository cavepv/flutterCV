name: CV App CI/CD

on:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - 'cv_app/**'
      - '.github/workflows/cv_app.yml'
  pull_request:
    paths:
      - 'cv_app/**'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: cv_app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # ponytail: --no-codesign proves the iOS build compiles without an
      # Apple Developer account. Not installable on a device — that needs
      # signing certs/provisioning profiles as CI secrets, add if you pay
      # for an Apple Developer account.
      - run: flutter build ios --release --no-codesign

  # ponytail: manual-trigger-only (workflow_dispatch) — this is a one-time
  # proof capture, not something that needs to run on every push. Re-run
  # manually via `gh workflow run` if the About screen UI changes.
  ios-simulator-screenshot:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --debug --simulator
      - name: Boot simulator, install, launch, screenshot
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          data = json.load(sys.stdin)['devices']
          for runtime, devices in data.items():
              for d in devices:
                  if d['name'].startswith('iPhone'):
                      print(d['udid']); sys.exit()
          ")
          xcrun simctl boot "$UDID"
          xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$UDID" com.carlospv.cvApp
          sleep 5
          xcrun simctl io "$UDID" screenshot ios_simulator.png
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshot
          path: cv_app/ios_simulator.png

  deploy-web:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # ponytail: base-href assumes GitHub Pages is served from the
      # gh-pages branch at repo-root for a project page named "flutterCV".
      # Adjust if Pages is configured differently.
      - run: flutter build web --base-href /flutterCV/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: cv_app/build/web
          publish_branch: gh-pages

  release-apk:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: softprops/action-gh-release@v2
        with:
          files: cv_app/build/app/outputs/flutter-apk/app-release.apk
